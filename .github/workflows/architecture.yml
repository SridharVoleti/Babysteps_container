name: Architecture boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cc-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CC-001 architecture tests
        run: npm run test:architecture
      - name: Enforce CC-001 app boundaries
        run: npm run check:architecture

  cc-002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CC-002 manifest acceptance tests
        run: npm run test:manifest
      - name: Validate all app manifests
        run: npm run check:manifests

  cc-003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CC-003 capability acceptance tests
        run: npm run test:capabilities
      - name: Enforce app capability/platform boundaries
        run: npm run check:architecture

  cc-004:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CC-004 extension acceptance tests
        run: npm run test:extensions
      - name: Enforce extension boundaries
        run: npm run check:architecture
