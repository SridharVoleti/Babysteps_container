name: Architecture boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cc-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CC-001 architecture tests
        run: npm run test:architecture
      - name: Enforce CC-001 app boundaries
        run: npm run check:architecture

  cc-002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CC-002 manifest acceptance tests
        run: npm run test:manifest
      - name: Validate all app manifests
        run: npm run check:manifests

  cc-003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CC-003 capability acceptance tests
        run: npm run test:capabilities
      - name: Enforce app capability/platform boundaries
        run: npm run check:architecture

  cc-004:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CC-004 extension acceptance tests
        run: npm run test:extensions
      - name: Enforce extension boundaries
        run: npm run check:architecture

  sb-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SB-001 launch-context acceptance tests
        run: npm run test:launch-context
      - name: Re-enforce architecture boundaries
        run: npm run check:architecture

  sb-002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SB-002 runtime context binding acceptance tests
        run: npm run test:runtime-binding
      - name: Re-enforce architecture boundaries
        run: npm run check:architecture

  sb-003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SB-003 atomic bootstrap acceptance tests
        run: npm run test:atomic-bootstrap
      - name: Re-enforce architecture boundaries
        run: npm run check:architecture

  api-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run API-001 Babysteps API client acceptance tests
        run: npm run test:api-client
      - name: Re-enforce architecture boundaries
        run: npm run check:architecture

  api-002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run API-002 authenticated request context acceptance tests
        run: npm run test:auth-context
      - name: Re-enforce architecture boundaries
        run: npm run check:architecture

  api-003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run API-003 contract validation acceptance tests
        run: npm run test:contract-validation
      - name: Re-enforce architecture boundaries
        run: npm run check:architecture

  sr-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SR-001 session runtime acceptance tests
        run: npm run test:session-runtime
      - name: Re-enforce architecture boundaries
        run: npm run check:architecture

  sr-002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SR-002 session lifecycle acceptance tests
        run: npm run test:session-lifecycle
      - name: Re-enforce architecture boundaries
        run: npm run check:architecture
