name: Architecture boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cc-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run CC-001 architecture tests
        run: npm run test:architecture
      - name: Enforce CC-001 app boundaries
        run: npm run check:architecture

  cc-002:
    runs-on: ubuntu-latest
